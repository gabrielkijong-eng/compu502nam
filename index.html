<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Captura de Datos</title>
</head>
<body>

  <h2>Captura de Datos</h2>

  <form id="formulario" action="https://script.google.com/macros/s/AKfycbwEmckptikGAiiYKhsG6EFc0MeT5mZ-3rRC8m8E11SfCIznf8X2l18-6cSJHVRhC-DjvQ/exec" method="POST" target="hidden_iframe" onsubmit="enviado()">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="apellido">apellido:</label><br>
    <input type="text" id="apellido" name="apellido" required><br><br>

    <label for="edad">Edad:</label><br>
    <input type="number" id="edad" name="edad" required min="1" max="120"><br><br>

    <label for="telefono">telefono:</label><br>
    <input type="number" id="telefono" name="telefono" required min="1000000000" max="999999999999"><br><br>
    
    <label for="correo">correo:</label><br>
    <input type="text" id="correo" name="correo" required><br><br>

    <label for="pais">pais:</label><br>
    <input type="text" id="pais" name="pais" required><br><br>

    <label for="ciudad">ciudad:</label><br>
    <input type="text" id="ciudad" name="ciudad" required><br><br>
    

    <button type="submit" id="btnEnviar">Enviar</button>
  </form>

  <p id="estado"></p>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    function enviado() {
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando...';
      
      setTimeout(function() {
        document.getElementById('estado').textContent = '¡Registro guardado con éxito!';
        document.getElementById('formulario').reset();
        document.getElementById('btnEnviar').disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
